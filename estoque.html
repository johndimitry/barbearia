<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estoque - Barbearia Premium</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

font-family:"Poppins",sans-serif;

background:#000;

color:white;

padding:40px;

}



body::before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;

z-index:-1;

}



.container{

max-width:1400px;

margin:auto;

}



.topo{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}



h1{

font-size:55px;

}



.gold{

color:#d4af37;

}



.btn{

background:#d4af37;

color:black;

border:none;

padding:15px 30px;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.form{

background:rgba(255,255,255,.05);

padding:35px;

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

margin-bottom:40px;

}



input{

width:100%;

height:60px;

margin-bottom:20px;

border-radius:15px;

border:none;

padding:20px;

font-size:18px;

}



button{

cursor:pointer;

}



.adicionar{

background:#d4af37;

border:none;

padding:15px 30px;

border-radius:15px;

font-weight:bold;

font-size:18px;

}



.resumo{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:25px;

margin-bottom:40px;

}



.cardResumo{

background:rgba(255,255,255,.05);

padding:30px;

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

text-align:center;

}



.cardResumo i{

font-size:45px;

color:#d4af37;

}



.cardResumo h2{

font-size:35px;

margin-top:15px;

}



.lista{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:25px;

}



.produto{

background:rgba(255,255,255,.05);

padding:30px;

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

}



.produto i{

font-size:45px;

color:#d4af37;

margin-bottom:20px;

}



.produto h2{

font-size:30px;

}



.info{

color:#aaa;

font-size:18px;

margin-top:15px;

line-height:1.8;

}



.remover{

margin-top:20px;

background:#ff4444;

color:white;

border:none;

padding:12px 20px;

border-radius:15px;

}



@media(max-width:900px){

.resumo,
.lista{

grid-template-columns:1fr;

}

}


</style>


</head>


<body>


<div class="container">


<div class="topo">


<h1>

Estoque <span class="gold">Premium</span>

</h1>


<button class="btn"
onclick="voltar()">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</button>


</div>



<div class="form">


<input 
id="produto"
placeholder="Nome do produto">


<input 
id="quantidade"
placeholder="Quantidade">


<input 
id="valor"
placeholder="Valor de compra">


<button class="adicionar"
onclick="adicionarProduto()">

Adicionar Produto

</button>


</div>




<div class="resumo">


<div class="cardResumo">

<i class="fa-solid fa-box"></i>

<h2 id="totalProdutos">

0

</h2>

<p>

Produtos

</p>

</div>



<div class="cardResumo">

<i class="fa-solid fa-layer-group"></i>

<h2 id="quantidadeTotal">

0

</h2>

<p>

Itens no estoque

</p>

</div>



<div class="cardResumo">

<i class="fa-solid fa-money-bill"></i>

<h2 id="valorTotal">

R$0

</h2>

<p>

Valor investido

</p>

</div>


</div>



<div class="lista" id="lista">


</div>



</div>




<script>


function carregarEstoque(){


const estoque =

JSON.parse(
localStorage.getItem("estoque")
) || [];



mostrar(estoque);


}



function mostrar(estoque){


const lista =

document.getElementById("lista");



lista.innerHTML="";



let quantidade = 0;

let valor = 0;



estoque.forEach((produto,index)=>{


quantidade += Number(produto.quantidade);


valor += Number(produto.valor);



lista.innerHTML +=


`

<div class="produto">


<i class="fa-solid fa-box-open"></i>


<h2>

${produto.nome}

</h2>


<div class="info">


📦 Quantidade:
${produto.quantidade}


<br>


💰 Valor:
R$ ${produto.valor}


</div>



<button class="remover"
onclick="removerProduto(${index})">

Excluir

</button>


</div>

`;



});



document.getElementById("totalProdutos").innerHTML=

estoque.length;



document.getElementById("quantidadeTotal").innerHTML=

quantidade;



document.getElementById("valorTotal").innerHTML=

"R$ "+valor;



}




function adicionarProduto(){


const nome =

document.getElementById("produto").value;



const quantidade =

document.getElementById("quantidade").value;



const valor =

document.getElementById("valor").value;



if(nome=="" || quantidade=="" || valor==""){

alert("Preencha todos os campos");

return;

}



let estoque =

JSON.parse(
localStorage.getItem("estoque")
) || [];



estoque.push({

nome:nome,

quantidade:quantidade,

valor:valor

});



localStorage.setItem(

"estoque",

JSON.stringify(estoque)

);



document.getElementById("produto").value="";

document.getElementById("quantidade").value="";

document.getElementById("valor").value="";



mostrar(estoque);



}




function removerProduto(index){


let estoque =

JSON.parse(
localStorage.getItem("estoque")
);



estoque.splice(index,1);



localStorage.setItem(

"estoque",

JSON.stringify(estoque)

);



mostrar(estoque);



}




function voltar(){

window.location.href="barbeiro.html";

}



carregarEstoque();



</script>


</body>

</html>
