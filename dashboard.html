<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Barbearia Premium</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

font-family:"Poppins",sans-serif;

background:#000;

color:white;

padding:40px;

}



body::before{

content:"";

position:fixed;

inset:0;


background:

linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");


background-size:cover;

z-index:-1;

}




.container{

max-width:1500px;

margin:auto;

}




.topo{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}



h1{

font-size:55px;

}



.gold{

color:#d4af37;

}



.btn{

background:#d4af37;

border:none;

padding:15px 30px;

border-radius:20px;

font-weight:bold;

font-size:18px;

cursor:pointer;

}




.cards{

display:grid;

grid-template-columns:

repeat(4,1fr);

gap:25px;

}



.card{

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

border-radius:30px;

padding:35px;

}



.card i{

font-size:45px;

color:#d4af37;

}



.card h2{

font-size:40px;

margin-top:20px;

}



.card p{

color:#aaa;

}




.area{

margin-top:40px;

display:grid;

grid-template-columns:

2fr 1fr;

gap:30px;

}



.box{

background:rgba(255,255,255,.05);

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

padding:35px;

}



.box h2{

font-size:32px;

margin-bottom:25px;

color:#d4af37;

}




.grafico{

height:300px;

display:flex;

align-items:end;

gap:25px;

}




.barra{

width:50px;

background:#d4af37;

border-radius:15px 15px 0 0;

}




.menu{

display:grid;

grid-template-columns:

repeat(2,1fr);

gap:20px;

}



.menu button{

height:90px;

border-radius:25px;

border:none;

background:#d4af37;

font-size:18px;

font-weight:bold;

cursor:pointer;

}




@media(max-width:1000px){


.cards{

grid-template-columns:1fr 1fr;

}



.area{

grid-template-columns:1fr;

}


}



@media(max-width:600px){


.cards,
.menu{

grid-template-columns:1fr;

}



h1{

font-size:38px;

}


}



</style>


</head>



<body>



<div class="container">



<div class="topo">


<h1>

Dashboard <span class="gold">Barbeiro</span>

</h1>



<button class="btn"
onclick="voltar()">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</button>


</div>




<div class="cards">



<div class="card">

<i class="fa-solid fa-money-bill"></i>

<h2 id="faturamento">

R$0

</h2>

<p>

Faturamento mês

</p>

</div>




<div class="card">

<i class="fa-solid fa-users"></i>

<h2 id="clientes">

0

</h2>

<p>

Clientes

</p>

</div>




<div class="card">

<i class="fa-solid fa-calendar"></i>

<h2 id="agendamentos">

0

</h2>

<p>

Agendamentos

</p>

</div>




<div class="card">

<i class="fa-solid fa-scissors"></i>

<h2 id="servicos">

0

</h2>

<p>

Serviços feitos

</p>

</div>


</div>






<div class="area">



<div class="box">


<h2>

Faturamento semanal

</h2>



<div class="grafico">


<div class="barra" style="height:80px"></div>

<div class="barra" style="height:150px"></div>

<div class="barra" style="height:220px"></div>

<div class="barra" style="height:120px"></div>

<div class="barra" style="height:260px"></div>


</div>



</div>






<div class="box">


<h2>

Acessos

</h2>



<div class="menu">


<button onclick="abrir('agenda.html')">

📅 Agenda

</button>



<button onclick="abrir('clientes.html')">

👥 Clientes

</button>



<button onclick="abrir('estoque.html')">

📦 Estoque

</button>



<button onclick="abrir('servicos.html')">

✂ Serviços

</button>



</div>


</div>



</div>



</div>





<script>



function carregarDados(){



let clientes =

JSON.parse(
localStorage.getItem("clientes")
) || [];



let agenda =

JSON.parse(
localStorage.getItem("agendamentos")
) || [];



let servicos =

JSON.parse(
localStorage.getItem("servicos")
) || [];



let total = 0;



servicos.forEach(s=>{


total += Number(s.preco);


});





document.getElementById("clientes").innerHTML=

clientes.length;



document.getElementById("agendamentos").innerHTML=

agenda.length;



document.getElementById("servicos").innerHTML=

agenda.length;



document.getElementById("faturamento").innerHTML=

"R$ "+total;




}





function abrir(pagina){

window.location.href=pagina;

}




function voltar(){

window.location.href="barbeiro.html";

}



carregarDados();



</script>



</body>

</html>
