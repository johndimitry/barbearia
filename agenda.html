<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agenda do Barbeiro</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

font-family:"Poppins",sans-serif;

background:#000;

color:white;

padding:40px;

}


body::before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;

z-index:-1;

}


.container{

max-width:1400px;

margin:auto;

}



.topo{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}



h1{

font-size:55px;

}


.gold{

color:#d4af37;

}



.btn{

background:#d4af37;

border:none;

padding:15px 30px;

border-radius:20px;

font-weight:bold;

cursor:pointer;

font-size:18px;

}



.lista{

display:flex;

flex-direction:column;

gap:25px;

}



.agendamento{

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

border-radius:30px;

padding:30px;

display:flex;

justify-content:space-between;

align-items:center;

}



.info h2{

font-size:32px;

}



.info p{

font-size:18px;

color:#aaa;

margin-top:8px;

}



.status{

padding:10px 20px;

border-radius:20px;

background:rgba(0,255,100,.15);

color:#00ff88;

display:inline-block;

margin-top:15px;

}



.acoes{

display:flex;

gap:15px;

}



button{

cursor:pointer;

}



.concluir{

background:#00ff88;

border:none;

padding:15px;

border-radius:15px;

}



.cancelar{

background:#ff4444;

color:white;

border:none;

padding:15px;

border-radius:15px;

}



.vazio{

text-align:center;

font-size:30px;

color:#aaa;

margin-top:100px;

}



@media(max-width:800px){

.agendamento{

flex-direction:column;

gap:25px;

}

}



</style>


</head>


<body>


<div class="container">


<div class="topo">


<h1>

Agenda <span class="gold">Barbeiro</span>

</h1>


<button class="btn"
onclick="voltar()">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</button>


</div>



<div class="lista" id="listaAgenda">


</div>



</div>




<script>



function carregarAgenda(){


const agenda =

JSON.parse(
localStorage.getItem("agendamentos")
) || [];



const lista =

document.getElementById("listaAgenda");



if(agenda.length===0){


lista.innerHTML=

`

<div class="vazio">

Nenhum horário marcado.

</div>

`;


return;

}



lista.innerHTML="";



agenda.forEach((item,index)=>{


lista.innerHTML +=


`

<div class="agendamento">


<div class="info">


<h2>

${item.nome}

</h2>


<p>

📱 ${item.telefone}

</p>


<p>

✂️ ${item.servico}

</p>


<p>

💈 ${item.barbeiro}

</p>


<p>

📅 ${item.data}

</p>


<p>

🕘 ${item.horario}

</p>


<div class="status">

${item.status}

</div>


</div>



<div class="acoes">


<button class="concluir"
onclick="concluir(${index})">

✔ Concluir

</button>



<button class="cancelar"
onclick="cancelar(${index})">

✖ Cancelar

</button>


</div>



</div>

`;


});


}





function concluir(index){


let agenda =

JSON.parse(
localStorage.getItem("agendamentos")
);



agenda[index].status="Concluído";



localStorage.setItem(

"agendamentos",

JSON.stringify(agenda)

);



carregarAgenda();


}




function cancelar(index){


let agenda =

JSON.parse(
localStorage.getItem("agendamentos")
);



agenda.splice(index,1);



localStorage.setItem(

"agendamentos",

JSON.stringify(agenda)

);



carregarAgenda();


}




function voltar(){

window.location.href="barbeiro.html";

}



carregarAgenda();



</script>


</body>

</html>
