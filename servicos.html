<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serviços - Barbearia Premium</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:"Poppins",sans-serif;

background:#000;

color:white;

padding:40px;

}



body::before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;

z-index:-1;

}



.container{

max-width:1300px;

margin:auto;

}



.topo{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}



h1{

font-size:55px;

}



.gold{

color:#d4af37;

}



.btn{

background:#d4af37;

color:black;

border:none;

padding:15px 30px;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.form{

background:rgba(255,255,255,.05);

padding:35px;

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

margin-bottom:40px;

}



input{

width:100%;

height:60px;

margin-bottom:20px;

border-radius:15px;

border:none;

outline:none;

padding:20px;

font-size:18px;

}



.salvar{

background:#d4af37;

border:none;

padding:15px 35px;

border-radius:15px;

font-weight:bold;

cursor:pointer;

font-size:18px;

}



.lista{

display:grid;

grid-template-columns:

repeat(3,1fr);

gap:25px;

}



.card{

background:rgba(255,255,255,.05);

padding:30px;

border-radius:30px;

border:1px solid rgba(212,175,55,.2);

}



.card i{

font-size:45px;

color:#d4af37;

margin-bottom:20px;

}



.card h2{

font-size:30px;

}



.preco{

color:#00ff88;

font-size:25px;

margin-top:15px;

}



.remover{

margin-top:20px;

background:#ff4444;

color:white;

border:none;

padding:12px 20px;

border-radius:15px;

cursor:pointer;

}



@media(max-width:900px){

.lista{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<div class="container">


<div class="topo">


<h1>

Serviços <span class="gold">Premium</span>

</h1>


<button class="btn"
onclick="voltar()">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</button>


</div>



<div class="form">


<input 
id="nomeServico"
placeholder="Nome do serviço">


<input 
id="precoServico"
placeholder="Preço exemplo: 45">


<button class="salvar"
onclick="adicionarServico()">

Adicionar Serviço

</button>


</div>



<div class="lista" id="lista">


</div>



</div>



<script>


function carregarServicos(){


let servicos =

JSON.parse(
localStorage.getItem("servicos")
) || [

{
nome:"Corte Masculino",
preco:40
},

{
nome:"Corte + Barba",
preco:65
}

];



localStorage.setItem(

"servicos",

JSON.stringify(servicos)

);



mostrar(servicos);



}



function mostrar(servicos){


const lista =

document.getElementById("lista");



lista.innerHTML="";



servicos.forEach((s,index)=>{


lista.innerHTML +=


`

<div class="card">


<i class="fa-solid fa-scissors"></i>


<h2>

${s.nome}

</h2>


<div class="preco">

R$ ${s.preco}

</div>


<button class="remover"
onclick="remover(${index})">

Excluir

</button>


</div>

`;



});


}




function adicionarServico(){


let nome =

document.getElementById("nomeServico").value;



let preco =

document.getElementById("precoServico").value;



if(nome=="" || preco==""){

alert("Preencha todos os campos");

return;

}



let servicos =

JSON.parse(
localStorage.getItem("servicos")
) || [];



servicos.push({

nome:nome,

preco:preco

});



localStorage.setItem(

"servicos",

JSON.stringify(servicos)

);



document.getElementById("nomeServico").value="";

document.getElementById("precoServico").value="";


mostrar(servicos);



}




function remover(index){


let servicos =

JSON.parse(
localStorage.getItem("servicos")
);



servicos.splice(index,1);



localStorage.setItem(

"servicos",

JSON.stringify(servicos)

);



mostrar(servicos);



}




function voltar(){

window.location.href="barbeiro.html";

}



carregarServicos();


</script>


</body>

</html>
