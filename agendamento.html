<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Agendamento - Barbearia Premium</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:#000;
color:white;
min-height:100vh;
overflow-x:hidden;
position:relative;

}

.background{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(0,0,0,.90),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;
background-position:center;
z-index:-1;

}

.container{

width:100%;
max-width:1300px;
margin:auto;
padding:40px;

}

header{

display:flex;
align-items:center;
gap:20px;
margin-bottom:40px;

}

.voltar{

width:60px;
height:60px;

border-radius:18px;

display:flex;
justify-content:center;
align-items:center;

text-decoration:none;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

color:#d4af37;

font-size:24px;

transition:.3s;

}

.voltar:hover{

transform:scale(1.1);

background:rgba(212,175,55,.15);

}

header h1{

font-size:48px;

font-weight:700;

display:flex;
align-items:center;
gap:15px;

}

header h1 i{

color:#d4af37;

}

.card{

width:100%;

padding:40px;

border-radius:35px;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.15);

backdrop-filter:blur(15px);

box-shadow:
0 20px 60px rgba(0,0,0,.45);

}

.card h2{

font-size:28px;

margin-top:25px;
margin-bottom:15px;

color:#d4af37;

}

select,
input{

width:100%;
height:65px;

border:none;

outline:none;

border-radius:18px;

padding:0 20px;

font-size:18px;

background:rgba(255,255,255,.08);

color:white;

margin-bottom:20px;

}

select option{

background:#111;

}

input[type=date]::-webkit-calendar-picker-indicator{

filter:invert(1);

cursor:pointer;

}
/* ========================================= */
/* HORÁRIOS */
/* ========================================= */

.horarios{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:18px;

margin-top:20px;

margin-bottom:35px;

}

.horarios button{

height:65px;

border:none;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.15);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.horarios button:hover{

transform:translateY(-4px);

background:rgba(212,175,55,.12);

border:1px solid #d4af37;

}

.horarios button.ativo{

background:#d4af37;

color:black;

font-weight:700;

}

.horarios button.ocupado{

background:#2b2b2b;

color:#777;

border:1px solid #444;

cursor:not-allowed;

pointer-events:none;

text-decoration:line-through;

}

/* ========================================= */
/* BOTÕES */
/* ========================================= */

.confirmar{

width:100%;

height:70px;

border:none;

border-radius:20px;

background:#d4af37;

color:black;

font-size:22px;

font-weight:700;

cursor:pointer;

transition:.3s;

margin-bottom:20px;

}

.confirmar:hover{

transform:translateY(-5px);

box-shadow:

0 15px 35px rgba(212,175,55,.35);

}

.meus{

width:100%;

height:65px;

border-radius:20px;

background:transparent;

border:2px solid #d4af37;

color:#d4af37;

font-size:20px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.meus:hover{

background:#d4af37;

color:black;

}

/* ========================================= */
/* TOAST */
/* ========================================= */

.toast{

position:fixed;

top:30px;

left:50%;

transform:translateX(-50%);

padding:18px 30px;

background:#d4af37;

color:black;

font-size:18px;

font-weight:700;

border-radius:18px;

z-index:99999;

animation:toast 3s forwards;

}

@keyframes toast{

0%{

opacity:0;

top:0;

}

10%{

opacity:1;

top:30px;

}

90%{

opacity:1;

}

100%{

opacity:0;

top:0;

}

}

/* ========================================= */
/* RESPONSIVO */
/* ========================================= */

@media(max-width:900px){

.horarios{

grid-template-columns:repeat(2,1fr);

}

header h1{

font-size:34px;

}

.card{

padding:25px;

}

}

@media(max-width:500px){

.container{

padding:20px;

}

.horarios{

grid-template-columns:1fr;

}

header{

flex-direction:column;

align-items:flex-start;

}

header h1{

font-size:28px;

}

select,
input{

height:60px;

font-size:16px;

}

.confirmar{

height:65px;

font-size:18px;

}

.meus{

height:60px;

font-size:18px;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="container">

<header>

<a href="barbeiro.html" class="voltar">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h1>

<i class="fa-solid fa-calendar-days"></i>

Agendamento

</h1>

</header>

<div class="card">

<h2>
<h2>

Nome do Cliente

</h2>

<input
type="text"
id="nome"
placeholder="Digite seu nome">

<h2>

Telefone

</h2>

<input
type="tel"
id="telefone"
placeholder="(11) 99999-9999">
Escolha seu serviço

</h2>

<select id="servico">

<option>Corte Masculino</option>

<option>Barba</option>

<option>Corte + Barba</option>

<option>Sobrancelha</option>

<option>Pigmentação</option>

<option>Hidratação</option>

</select>

<h2>

Escolha o barbeiro

</h2>

<select id="barbeiro">

<option>Lucas</option>

<option>Samuel</option>

<option>João</option>

<option>Carlos</option>

</select>

<h2>

Data

</h2>

<input
type="date"
id="data">

<h2>

Horários

</h2>

<div class="horarios">

<button onclick="selecionarHorario(this)">
09:00
</button>

<button onclick="selecionarHorario(this)">
09:30
</button>

<button onclick="selecionarHorario(this)">
10:00
</button>

<button onclick="selecionarHorario(this)">
10:30
</button>

<button onclick="selecionarHorario(this)">
11:00
</button>

<button onclick="selecionarHorario(this)">
11:30
</button>

<button onclick="selecionarHorario(this)">
13:00
</button>

<button onclick="selecionarHorario(this)">
13:30
</button>

<button onclick="selecionarHorario(this)">
14:00
</button>

<button onclick="selecionarHorario(this)">
14:30
</button>

<button onclick="selecionarHorario(this)">
15:00
</button>

<button onclick="selecionarHorario(this)">
15:30
</button>

<button onclick="selecionarHorario(this)">
16:00
</button>

<button onclick="selecionarHorario(this)">
16:30
</button>

<button onclick="selecionarHorario(this)">
17:00
</button>

<button onclick="selecionarHorario(this)">
17:30
</button>

</div>

<button
class="confirmar"
onclick="agendar()">


Confirmar Agendamento

</button>

<button
class="meus"
onclick="window.location='meus-agendamentos.html'">

Meus Agendamentos

</button>

</div>

</div>

<script>

/* ========================================= */
/* VARIÁVEIS */
/* ========================================= */

let horarioSelecionado = "";

/* ========================================= */
/* TOAST */
/* ========================================= */

function showToast(texto){

const toast = document.createElement("div");

toast.className = "toast";

toast.innerHTML = texto;

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},3000);

}

/* ========================================= */
/* SELECIONAR HORÁRIO */
/* ========================================= */

function selecionarHorario(botao){

// Remove seleção anterior

document.querySelectorAll(".horarios button").forEach(btn=>{

if(!btn.classList.contains("ocupado")){

btn.classList.remove("ativo");

}

});

// Marca o botão clicado

botao.classList.add("ativo");

horarioSelecionado = botao.innerText;

}

/* ========================================= */
/* CARREGAR HORÁRIOS OCUPADOS */
/* ========================================= */

function carregarHorarios(){

const agendamentos =
JSON.parse(localStorage.getItem("agendamentos")) || [];

const data =
document.getElementById("data").value;

document.querySelectorAll(".horarios button").forEach(btn=>{

btn.classList.remove("ocupado");

btn.classList.remove("ativo");

});

horarioSelecionado = "";

if(data==="") return;

agendamentos.forEach(item=>{

if(item.data===data){

document.querySelectorAll(".horarios button").forEach(btn=>{

if(btn.innerText===item.horario){

btn.classList.add("ocupado");

}

});

}

});

}

/* ========================================= */
/* ATUALIZAR QUANDO TROCAR A DATA */
/* ========================================= */

document
.getElementById("data")
.addEventListener("change",carregarHorarios);
/* ========================================= */
/* CONFIRMAR AGENDAMENTO */
/* ========================================= */

function agendar(){
    const nome =
document.getElementById("nome").value="";

document.getElementById("telefone").value="";

const servico =
document.getElementById("servico").value;

const barbeiro =
document.getElementById("barbeiro").value;

const data =
document.getElementById("data").value;
if(nome.trim()==""){

showToast("Digite seu nome.");

return;

}

if(telefone.trim()==""){

showToast("Digite seu telefone.");

return;

}
/* VALIDAÇÕES */

if(data===""){

showToast("📅 Escolha uma data.");

return;

}

if(horarioSelecionado===""){

showToast("🕘 Escolha um horário.");

return;

}

/* LER LOCALSTORAGE */

const agendamentos =
JSON.parse(localStorage.getItem("agendamentos")) || [];

/* VERIFICAR SE O HORÁRIO JÁ ESTÁ OCUPADO */

const existe = agendamentos.find(item =>

item.data === data &&
item.horario === horarioSelecionado

);

if(existe){

showToast("❌ Esse horário já está ocupado.");

carregarHorarios();

return;

}

/* CRIAR OBJETO */

const novoAgendamento = {

id: Date.now(),
nome:nome,

telefone:telefone,

servico: servico,

barbeiro: barbeiro,

data: data,

horario: horarioSelecionado,

status: "Confirmado"

};

/* SALVAR */

agendamentos.push(novoAgendamento);

localStorage.setItem(

"agendamentos",

JSON.stringify(agendamentos)

);

/* ATUALIZA TELA */

showToast("✅ Agendamento realizado!");

carregarHorarios();

/* LIMPAR CAMPOS */

document.getElementById("servico").selectedIndex = 0;

document.getElementById("barbeiro").selectedIndex = 0;

document.getElementById("data").value = "";

horarioSelecionado = "";

document.querySelectorAll(".horarios button").forEach(btn=>{

btn.classList.remove("ativo");

});

/* REDIRECIONAR */

setTimeout(()=>{

window.location.href="meus-agendamentos.html";

},1500);

}

</script>

</body>

</html>
