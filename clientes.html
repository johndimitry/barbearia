<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes - Barbearia Premium</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;

}


body{

font-family:"Poppins",sans-serif;

background:#000;

color:white;

padding:40px;

}


body::before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
rgba(0,0,0,.85),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;

z-index:-1;

}



.container{

max-width:1400px;

margin:auto;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:40px;

}



.header h1{

font-size:55px;

}



.gold{

color:#d4af37;

}



.voltar{

background:#d4af37;

color:black;

border:none;

padding:15px 30px;

border-radius:20px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.cards{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:25px;

}



.cliente{

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

border-radius:30px;

padding:30px;

transition:.3s;

}



.cliente:hover{

transform:translateY(-8px);

}



.cliente i{

font-size:50px;

color:#d4af37;

margin-bottom:20px;

}



.cliente h2{

font-size:30px;

margin-bottom:15px;

}



.info{

color:#bbb;

font-size:18px;

line-height:1.8;

}



.status{

display:inline-block;

margin-top:20px;

padding:10px 20px;

border-radius:20px;

background:rgba(0,255,100,.15);

color:#00ff88;

}



.vazio{

text-align:center;

font-size:30px;

color:#aaa;

margin-top:100px;

}



@media(max-width:900px){

.cards{

grid-template-columns:1fr;

}

.header{

flex-direction:column;

gap:20px;

}

}



</style>

</head>


<body>


<div class="container">


<div class="header">


<h1>

Clientes <span class="gold">Premium</span>

</h1>


<button class="voltar"
onclick="voltar()">

<i class="fa-solid fa-arrow-left"></i>

Voltar

</button>


</div>



<div class="cards" id="listaClientes">


</div>



</div>



<script>


function carregarClientes(){


const clientes =

JSON.parse(
localStorage.getItem("agendamentos")
) || [];



const lista =

document.getElementById("listaClientes");



if(clientes.length===0){


lista.innerHTML=

`

<div class="vazio">

Nenhum cliente agendado ainda.

</div>

`;

return;

}



lista.innerHTML="";



clientes.forEach(cliente=>{


lista.innerHTML +=


`

<div class="cliente">


<i class="fa-solid fa-user"></i>


<h2>

${cliente.nome}

</h2>


<div class="info">


📱 ${cliente.telefone}

<br>


✂️ ${cliente.servico}

<br>


💈 ${cliente.barbeiro}

<br>


📅 ${cliente.data}

<br>


🕘 ${cliente.horario}


</div>



<div class="status">

${cliente.status}

</div>


</div>

`;



});


}




function voltar(){


window.location.href="barbeiro.html";


}



carregarClientes();



</script>


</body>

</html>
