<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Meus Agendamentos</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{

background:#000;
color:white;
min-height:100vh;
overflow-x:hidden;
position:relative;

}

.background{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:

linear-gradient(
rgba(0,0,0,.90),
rgba(0,0,0,.95)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;
background-position:center;

z-index:-1;

}

.container{

max-width:1200px;

margin:auto;

padding:40px;

}

header{

display:flex;

align-items:center;

gap:20px;

margin-bottom:40px;

}

.voltar{

width:60px;

height:60px;

display:flex;

justify-content:center;

align-items:center;

border-radius:18px;

text-decoration:none;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

color:#d4af37;

font-size:24px;

transition:.3s;

}

.voltar:hover{

transform:scale(1.1);

background:rgba(212,175,55,.15);

}

header h1{

font-size:45px;

display:flex;

align-items:center;

gap:15px;

}

header h1 i{

color:#d4af37;

}

#listaAgendamentos{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(350px,1fr));

gap:25px;

}

.card{

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.2);

border-radius:25px;

padding:30px;

backdrop-filter:blur(15px);

transition:.3s;

}

.card:hover{

transform:translateY(-5px);

border-color:#d4af37;

}

.card h2{

color:#d4af37;

font-size:28px;

margin-bottom:20px;

}

.card p{

font-size:18px;

margin-bottom:12px;

color:#ddd;

}

.status{

display:inline-block;

margin-top:10px;

padding:8px 16px;

border-radius:999px;

background:rgba(0,255,120,.15);

color:#00ff88;

font-weight:600;

}

.cancelar{

margin-top:25px;

width:100%;

height:55px;

border:none;

border-radius:15px;

background:#ff3b3b;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.cancelar:hover{

background:#d40000;

}

.botoes{

margin-top:50px;

display:flex;

gap:20px;

}

.botoes button{

flex:1;

height:65px;

border:none;

border-radius:18px;

background:#d4af37;

color:black;

font-size:20px;

font-weight:700;

cursor:pointer;

transition:.3s;

}

.botoes button:hover{

transform:translateY(-4px);

box-shadow:0 15px 35px rgba(212,175,55,.35);

}

.toast{

position:fixed;

top:30px;

left:50%;

transform:translateX(-50%);

padding:18px 28px;

border-radius:18px;

background:#d4af37;

color:black;

font-weight:700;

z-index:99999;

animation:fade 3s forwards;

}

@keyframes fade{

0%{
opacity:0;
top:0;
}

10%{
opacity:1;
top:30px;
}

90%{
opacity:1;
}

100%{
opacity:0;
}

}

@media(max-width:768px){

.container{

padding:20px;

}

header h1{

font-size:32px;

}

.botoes{

flex-direction:column;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="container">

<header>

<a href="barbeiro.html" class="voltar">

<i class="fa-solid fa-arrow-left"></i>

</a>

<h1>

<i class="fa-solid fa-calendar-check"></i>

Meus Agendamentos

</h1>

</header>

<div id="listaAgendamentos">

<!-- Os cards serão criados pelo JavaScript -->

</div>

<div class="botoes">

<button onclick="window.location='agendamento.html'">

Novo Agendamento

</button>

<button onclick="window.location='barbeiro.html'">

Voltar ao Início

</button>

</div>

</div>

<script>

/* ========================================= */
/* TOAST */
/* ========================================= */

function showToast(texto){

const toast = document.createElement("div");

toast.className = "toast";

toast.innerHTML = texto;

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},3000);

}

/* ========================================= */
/* FORMATAR DATA */
/* ========================================= */

function formatarData(data){

const partes = data.split("-");

return partes[2] + "/" + partes[1] + "/" + partes[0];

}

/* ========================================= */
/* LISTAR AGENDAMENTOS */
/* ========================================= */

function carregarAgendamentos(){

const lista =
document.getElementById("listaAgendamentos");

lista.innerHTML = "";

const agendamentos =
JSON.parse(localStorage.getItem("agendamentos")) || [];

if(agendamentos.length===0){

lista.innerHTML = `

<div class="card">

<h2>Nenhum agendamento</h2>

<p>

Você ainda não possui horários marcados.

</p>

</div>

`;

return;

}

agendamentos.forEach((item,index)=>{

lista.innerHTML += `

<div class="card">

<h2>

✂️ ${item.servico}

</h2>

<p>

👨 <strong>Barbeiro:</strong>

${item.barbeiro}

</p>

<p>

📅 <strong>Data:</strong>

${formatarData(item.data)}

</p>

<p>

🕘 <strong>Horário:</strong>

${item.horario}

</p>

<div class="status">

✅ ${item.status}

</div>

<button
class="cancelar"
onclick="cancelarAgendamento(${index})">

Cancelar Agendamento

</button>

</div>

`;

});

}

/* ========================================= */
/* CANCELAR */
/* ========================================= */

function cancelarAgendamento(indice){

const confirmar =
confirm("Deseja cancelar este horário?");

if(!confirmar){

return;

}

let agendamentos =
JSON.parse(localStorage.getItem("agendamentos")) || [];

agendamentos.splice(indice,1);

localStorage.setItem(

"agendamentos",

JSON.stringify(agendamentos)

);

showToast("❌ Agendamento cancelado.");

carregarAgendamentos();

}

/* ========================================= */
/* INICIAR */
/* ========================================= */

carregarAgendamentos();

</script>

</body>

</html>
