<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login Barbearia Premium</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

/* ================================================= */
/* RESET */
/* ================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{

scroll-behavior:smooth;
}

body{

font-family:"Poppins",sans-serif;

background:#000 ;

color:white;

overflow-x:hidden;

min-height:100vh;

position:relative;
}

/* ================================================= */
/* BACKGROUND */
/* ================================================= */

body::before{

content:"";

position:fixed;
inset:0;

background:

linear-gradient(
rgba(0,0,0,.88),
rgba(0,0,0,.94)
),

url("https://images.unsplash.com/photo-1621605815971-fbc98d665033?q=80&w=1974&auto=format&fit=crop");

background-size:cover;
background-position:center;

z-index:-2;
}

/* ================================================= */
/* CONTAINER */
/* ================================================= */

.container{

width:100%;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:40px;
}

/* ================================================= */
/* LOGIN BOX */
/* ================================================= */

.loginBox{

width:100%;
max-width:650px;

padding:55px;

border-radius:40px;

background:rgba(255,255,255,.05);

border:1px solid rgba(212,175,55,.15);

backdrop-filter:blur(15px);

box-shadow:
0 25px 70px rgba(0,0,0,.45);

animation:subir 1s ease;
}

@keyframes subir{

from{

opacity:0;
transform:translateY(60px);
}

to{

opacity:1;
transform:translateY(0);
}

}

/* ================================================= */
/* LOGO */
/* ================================================= */

.logo{

text-align:center;

margin-bottom:40px;
}

.logo i{

font-size:95px;

color:#d4af37;

margin-bottom:20px;

animation:girar 5s linear infinite;
}

/* FUNÇÃO GIRAR */

@keyframes girar{

0%{

transform:rotate(0deg);
}

100%{

transform:rotate(360deg);
}

}

.logo h1{

font-size:60px;

font-weight:700;
}

.logo span{

color:#d4af37;
}

.logo p{

margin-top:12px;

color:#aaa;

font-size:20px;

letter-spacing:2px;
}

/* ================================================= */
/* FORM */
/* ================================================= */

.formGroup{

margin-bottom:28px;
}

.formGroup label{

display:block;

margin-bottom:12px;

font-size:18px;

color:#dedbd3;
}

.inputBox{

height:78px;

border-radius:22px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

display:flex;
align-items:center;

padding:0 24px;

transition:.3s;
}

.inputBox:focus-within{

border:1px solid rgba(212,175,55,.4);

box-shadow:
0 0 25px rgba(212,175,55,.18);
}

.inputBox i{

font-size:24px;

color:#d4af37;

margin-right:16px;
}

.inputBox input{

flex:1;

height:100%;

background:none;

border:none;

outline:none;

font-size:20px;

color:white;

font-family:"Poppins",sans-serif;
}

.inputBox input::placeholder{

color:#888;
}

/* ================================================= */
/* BOTÃO */
/* ================================================= */

.btn{

width:100%;
height:78px;

border:none;

border-radius:24px;

background:#d4af37;

color:black;

font-size:24px;

font-weight:700;

cursor:pointer;

transition:.3s;

margin-top:10px;
}

.btn:hover{

transform:translateY(-4px);

box-shadow:
0 15px 35px rgba(212,175,55,.35);
}

/* ================================================= */
/* USERS */
/* ================================================= */

.users{

margin-top:35px;

padding:28px;

border-radius:25px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.06);
}

.users h3{

font-size:22px;

margin-bottom:20px;

color:#d4af37;
}

.users p{

font-size:18px;

margin-top:12px;

color:#ccc;
}

/* ================================================= */
/* SCROLL BUTTON */
/* ================================================= */

.scrollBtn{

margin-top:35px;

display:flex;
justify-content:center;
align-items:center;

cursor:pointer;

animation:descer 1.5s infinite;
}

.scrollBtn i{

font-size:40px;

color:#d4af37;
}

@keyframes descer{

0%{

transform:translateY(0);
}

50%{

transform:translateY(10px);
}

100%{

transform:translateY(0);
}

}

/* ================================================= */
/* TOAST */
/* ================================================= */

.toast{

position:fixed;

top:30px;
left:50%;

transform:translateX(-50%);

padding:18px 28px;

border-radius:18px;

background:#d4af37;

color:black;

font-weight:700;

font-size:18px;

z-index:99999;

animation:fade 3s forwards;
}

@keyframes fade{

0%{
opacity:0;
top:0;
}

10%{
opacity:1;
top:30px;
}

90%{
opacity:1;
}

100%{
opacity:0;
}

}

/* ================================================= */
/* RESPONSIVO */
/* ================================================= */

@media(max-width:900px){

.loginBox{

max-width:100%;
}

}

@media(max-width:600px){

.container{

padding:20px;
}

.loginBox{

padding:35px;
}

.logo h1{

font-size:42px;
}

.logo i{

font-size:75px;
}

.inputBox{

height:68px;
}

.btn{

height:68px;

font-size:20px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="loginBox">

<!-- ================================================= -->
<!-- LOGO -->
<!-- ================================================= -->

<div class="logo">

<i class="fa-solid fa-scissors"></i>

<h1>BARBEARIA <span>PREMIUM</span></h1>

<p>SISTEMA PROFISSIONAL</p>

</div>

<!-- ================================================= -->
<!-- FORM -->
<!-- ================================================= -->

<div class="formGroup">

<label>Usuário</label>

<div class="inputBox">

<i class="fa-regular fa-user"></i>

<input
type="text"
id="usuario"
placeholder="Digite o usuário"
/>

</div>

</div>

<div class="formGroup">

<label>Senha</label>

<div class="inputBox">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="senha"
placeholder="Digite a senha"
/>

</div>

</div>

<!-- ================================================= -->
<!-- BOTÃO -->
<!-- ================================================= -->

<button class="btn"
onclick="fazerLogin()">

ENTRAR

</button>

<!-- ================================================= -->
<!-- USERS -->
<!-- ================================================= -->

<div class="users">

<h3>Usuários cadastrados</h3>

<p>👤 john — 🔑 aniversario</p>

<p>👤 samuel — 🔑 sim</p>

<p>👤 lucas — 🔑 brutal</p>

<p>👤 geovania — 🔑 minecraft</p>

<p>👤 raphael — 🔑 rock</p>

</div>

<!-- ================================================= -->
<!-- SCROLL ICON -->
<!-- ================================================= -->

<div class="scrollBtn">

<i class="fa-solid fa-angles-down"></i>

</div>

</div>

</div>

<script>

/* ================================================= */
/* USUÁRIOS */
/* ================================================= */

const usuarios = [

{
nome:"john",
senha:"2302"
},

{
nome:"samuel",
senha:"cincão"
},

{
nome:"lucas the chanpion",
senha:"67"
},

{
nome:"geovania",
senha:"esqueleto"
},

{
nome:"raphael",
senha:"1935"
}

];

/* ================================================= */
/* TOAST */
/* ================================================= */

function showToast(text){

const toast =
document.createElement("div");

toast.classList.add("toast");

toast.innerHTML = text;

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},3000);

}

/* ================================================= */
/* LOGIN */
/* ================================================= */

function fazerLogin(){

const usuario =
document.getElementById("usuario").value.toLowerCase();

const senha =
document.getElementById("senha").value;

/* VERIFICAR */

const loginValido =
usuarios.find(user =>

user.nome === usuario &&
user.senha === senha

);

/* LOGIN CERTO */

if(loginValido){

showToast(
"✅ Bem-vindo " + loginValido.nome
);

/* REDIRECIONAR */

setTimeout(()=>{

window.location.href = "barbeiro.html";

},1500);

}else{

showToast(
"❌ Usuário ou senha inválidos"
);

}

}

/* ================================================= */
/* ENTER LOGIN */
/* ================================================= */

document.addEventListener("keydown", function(e){

if(e.key === "Enter"){

fazerLogin();

}

});

</script>

</body>

</html>
